services:
  kestra:
    image: kestra/kestra:latest
    container_name: kestra

    user: root
    privileged: true

    command: server standalone

    ports:
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./flows:/app/flows
      - ./script:/app/script
      - ./data:/app/data
      - ./outputs:/app/outputs

    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          repository:
            type: memory
          queue:
            type: memory
          storage:
            type: local
            local:
              base-path: "/tmp/kestra/storage"